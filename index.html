<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SF Election Results Bubble Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    
    .description {
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: #555;
    }
    
    #controls {
      margin: 0 auto 20px;
      width: 600px;
      text-align: center;
    }
    
    #map-container {
      width: 960px;
      margin: 0 auto;
      position: relative;
      background-color: #f8f8f8;
    }
    
    .land {
      fill: #eee;
    }
    
    .boundary {
      fill: none;
      stroke: #ddd;
      stroke-width: 0.5px;
    }
    
    .bubble {
      fill: red;
      fill-opacity: 0.7;
      stroke: white;
      stroke-width: 1px;
    }
    
    .tooltip {
      position: absolute;
      background: #fff;
      border: 1px solid #ccc;
      padding: 5px;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <h1>San Francisco Election Results by Precinct</h1>
  <div class="description">Bubble size represents total votes in each precinct for the selected contest</div>
  
  <div id="controls">
    <label for="contest-select">Select Contest: </label>
    <select id="contest-select"></select>
  </div>
  
  <div id="map-container">
    <div id="tooltip" class="tooltip"></div>
  </div>
  
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    // Main dimensions and setup
    const width = 960;
    const height = 600;
    
    // Create SVG
    const svg = d3.select("#map-container")
      .append("svg")
      .attr("width", width)
      .attr("height", height);
      
    // Create tooltip
    const tooltip = d3.select("#tooltip");
    
    // Define projection for San Francisco
    const projection = d3.geoMercator()
      .center([-122.45, 37.75])
      .scale(220000)
      .translate([width / 2, height / 2]);
      
    const path = d3.geoPath()
      .projection(projection);
    
    // Load all data files
    Promise.all([
      d3.json("11-2024-precinct-shapes.json"),
      d3.json("11-2024-precinct-vote.json"),
      d3.json("11-2024-meta.json")
    ]).then(([shapesData, votesData, metaData]) => {
      // Set up the dropdown for contest selection
      const contests = metaData.contests;
      const contestSelect = d3.select("#contest-select");
      
      // Add options to dropdown
      contests.forEach(contest => {
        contestSelect.append("option")
          .attr("value", contest.Id)
          .text(contest.Description);
      });
      
      // Get precinct features from the shapes file
      const precincts = shapesData.features;
      
      // Create map from precinct ID to votes
      const votesByPrecinct = {};
      votesData.forEach(precinct => {
        votesByPrecinct[precinct.prec_2012] = precinct.Contests;
      });
      
      // Draw the base map (grey)
      svg.append("g")
        .selectAll("path")
        .data(precincts)
        .enter()
        .append("path")
        .attr("d", path)
        .attr("class", "land");
      
      // Draw precinct boundaries
      svg.append("g")
        .selectAll("path")
        .data(precincts)
        .enter()
        .append("path")
        .attr("d", path)
        .attr("class", "boundary");
      
      // Create a separate group for bubbles - this MUST be after the map
      const bubblesGroup = svg.append("g");
      
      // Utility function to calculate total votes for a precinct and contest
      function getTotalVotes(precinctId, contestId) {
        const precinctData = votesByPrecinct[precinctId] || {};
        const contestData = precinctData[contestId] || {};
        let total = 0;
        
        // Sum all votes except for total and maxVote fields
        Object.keys(contestData).forEach(key => {
          if (key !== 'total' && key !== 'maxVote') {
            total += contestData[key] || 0;
          }
        });
        
        return total;
      }
      
      // Function to update visualization when contest changes
      function updateVisualization(contestId) {
        // Find the contest
        const selectedContest = contests.find(c => c.Id == contestId);
        if (!selectedContest) return;
        
        console.log("Updating for contest:", selectedContest.Description);
        
        // Clear existing bubbles
        bubblesGroup.selectAll("*").remove();
        
        // Find max votes for scaling
        let maxVotes = 0;
        precincts.forEach(precinct => {
          const precinctId = precinct.properties.prec_2012;
          const votes = getTotalVotes(precinctId, contestId);
          if (votes > maxVotes) maxVotes = votes;
        });
        
        console.log("Max votes:", maxVotes);
        
        // Scale for bubble sizes
        const radiusScale = d3.scaleSqrt()
          .domain([0, maxVotes])
          .range([0, 40]);
        
        // First just add test circles directly at each precinct centroid
        precincts.forEach(precinct => {
          const precinctId = precinct.properties.prec_2012;
          const votes = getTotalVotes(precinctId, contestId);
          
          if (votes > 0) {
            // Get the centroid
            const centroid = path.centroid(precinct);
            
            // Only add if centroid is valid
            if (centroid && !isNaN(centroid[0]) && !isNaN(centroid[1])) {
              // Log the values for debugging
              if (precinctId === '1101' || precinctId === '1102' || precinctId === '1103') {
                console.log(`Precinct ${precinctId}: votes=${votes}, centroid=[${centroid[0]}, ${centroid[1]}], radius=${radiusScale(votes)}`);
              }
              
              // Add circle at this location
              bubblesGroup.append("circle")
                .attr("cx", centroid[0])
                .attr("cy", centroid[1])
                .attr("r", radiusScale(votes))
                .attr("class", "bubble")
                .on("mouseover", function(event) {
                  tooltip
                    .style("opacity", 1)
                    .html(`<strong>Precinct:</strong> ${precinct.properties.Description}<br>
                           <strong>Votes:</strong> ${votes}`)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                  tooltip.style("opacity", 0);
                });
            }
          }
        });
      }
      
      // Listen for dropdown changes
      contestSelect.on("change", function() {
        updateVisualization(this.value);
      });
      
      // Initialize with turnout (99) or first contest
      const initialContest = contests.find(c => c.Id === 99) || contests[0];
      contestSelect.property("value", initialContest.Id);
      updateVisualization(initialContest.Id);
    });
  </script>
</body>
</html>
