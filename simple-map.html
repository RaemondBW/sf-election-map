<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ultra Simple SF Bubble Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
    }
    
    #container {
      width: 960px;
      height: 600px;
      margin: 0 auto;
      position: relative;
      border: 1px solid #6c6b6b;
      background-color: #f0f0f0;
      overflow: hidden;
    }
    
    .map-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .bubble-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .bubble {
      position: absolute;
      background-color: red;
      border: 2px solid white;
      border-radius: 50%;
      opacity: 0.7;
      transform: translate(-50%, -50%);
    }
    
    .test-pattern {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      width: 100%;
      height: 100%;
    }
    
    .test-cell {
      border: 1px dashed #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #999;
    }
    
    button {
      padding: 8px 16px;
      margin: 10px;
      cursor: pointer;
    }
    
    .controls {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Ultra Simple SF Bubble Map</h1>
  
  <div class="controls">
    <button id="btn-test-pattern">Show Grid</button>
    <button id="btn-add-bubbles">Add Test Bubbles</button>
    <button id="btn-force-bubbles">Force Add DOM Bubbles</button>
  </div>
  
  <div id="container">
    <div class="map-layer" id="map-layer"></div>
    <div class="bubble-layer" id="bubble-layer"></div>
  </div>
  
  <script>
    // Show a grid pattern to verify positioning
    document.getElementById('btn-test-pattern').addEventListener('click', function() {
      const mapLayer = document.getElementById('map-layer');
      mapLayer.innerHTML = '';
      
      const grid = document.createElement('div');
      grid.className = 'test-pattern';
      
      for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'test-cell';
        cell.textContent = i;
        grid.appendChild(cell);
      }
      
      mapLayer.appendChild(grid);
    });
    
    // Add test bubbles
    document.getElementById('btn-add-bubbles').addEventListener('click', function() {
      const bubbleLayer = document.getElementById('bubble-layer');
      bubbleLayer.innerHTML = '';
      
      // Add test bubbles
      const testPositions = [
        {x: "10%", y: "10%", size: 20},
        {x: "25%", y: "25%", size: 30},
        {x: "50%", y: "50%", size: 40},
        {x: "75%", y: "25%", size: 50},
        {x: "90%", y: "10%", size: 60},
        {x: "10%", y: "90%", size: 70},
        {x: "90%", y: "90%", size: 80}
      ];
      
      testPositions.forEach(pos => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.style.left = pos.x;
        bubble.style.top = pos.y;
        bubble.style.width = pos.size + 'px';
        bubble.style.height = pos.size + 'px';
        bubbleLayer.appendChild(bubble);
      });
      
      console.log("Added test bubbles", testPositions.length);
    });
    
    // Force add DOM bubbles
    document.getElementById('btn-force-bubbles').addEventListener('click', function() {
      // Directly add bubbles without using SVG
      const container = document.getElementById('container');
      
      // Add bubbles with absolute positioning
      for (let i = 0; i < 10; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const x = 100 + (i * 80);
        const y = 100 + (i * 40);
        const size = 20 + (i * 5);
        
        bubble.style.position = 'absolute';
        bubble.style.left = x + 'px';
        bubble.style.top = y + 'px';
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.backgroundColor = 'blue';
        bubble.style.border = '2px solid white';
        bubble.style.borderRadius = '50%';
        bubble.style.opacity = '0.7';
        bubble.style.transform = 'translate(-50%, -50%)';
        bubble.style.zIndex = '1000';
        
        container.appendChild(bubble);
      }
      
      console.log("Force added 10 DOM bubbles");
    });
    
    // Load data files
    async function loadData() {
      try {
        const [shapesResponse, votesResponse, metaResponse] = await Promise.all([
          fetch('11-2024-precinct-shapes.json'),
          fetch('11-2024-precinct-vote.json'),
          fetch('11-2024-meta.json')
        ]);
        
        const shapes = await shapesResponse.json();
        const votes = await votesResponse.json();
        const meta = await metaResponse.json();
        
        console.log("Data loaded successfully");
        console.log("Shapes features:", shapes.features.length);
        console.log("Vote entries:", votes.length);
        console.log("Meta contests:", meta.contests.length);
        
        // Add one bubble for testing at a fixed position
        const bubbleLayer = document.getElementById('bubble-layer');
        const testBubble = document.createElement('div');
        testBubble.className = 'bubble';
        testBubble.style.left = '50%';
        testBubble.style.top = '50%';
        testBubble.style.width = '40px';
        testBubble.style.height = '40px';
        bubbleLayer.appendChild(testBubble);
        
        console.log("Added test bubble at center");
        
      } catch (error) {
        console.error("Error loading data:", error);
      }
    }
    
    // Initialize
    loadData();
  </script>
</body>
</html>
