.tooltip {
  position: absolute;
  background: #fff;
  border: 1px solid black;
  padding: 5px;
  border-radius: 3px;
  pointer-events: none;
  opacity: 0;
  font-size: 12px;
  z-index: 1000;
  transform: translate(-50%, -100%); /* Position above the mouse */
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  max-width: 400px;
}
