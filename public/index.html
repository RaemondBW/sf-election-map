<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SF Election Results Bubble Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    
    .description {
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: #555;
    }
    
    #controls {
      margin: 0 auto 40px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 0 20px;
      box-sizing: border-box;
    }
    
    #map-container {
      width: 960px;
      margin: 0 auto;
      position: relative;
      background-color: white;
      padding: 60px 20px 20px 20px;
    }
    
    .land {
      fill: white;
    }
    
    .boundary {
      fill: none;
      stroke: black;
      stroke-width: 0.5px;
    }
    
    .bubble {
      stroke: black;
      stroke-width: 1px;
      transition: r 0.2s ease, stroke-width 0.2s ease;
    }
    
    .tooltip {
      position: absolute;
      background: #fff;
      border: 1px solid black;
      padding: 5px;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      font-size: 12px;
      z-index: 1000;
      transform: translate(-50%, -100%); /* Position above the mouse */
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      min-width: 300px;
    }
    
    .vote-bar {
      margin: 15px 0 2px 0;  /* Increased top margin for the label */
      position: relative;
      width: 100%;
    }
    
    .vote-bar-container {
      height: 12px;
      background: #eee;
      position: relative;
      width: 100%;
    }
    
    .vote-bar-fill {
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
    }
    
    .vote-bar-label {
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 2px;
      font-size: 11px;
      color: black;
      white-space: nowrap;  /* Prevent text wrapping */
      width: auto;  /* Allow text to extend beyond container */
    }
    
    #contest-select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 8px;
      background-color: white;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 12px;
      transition: border-color 0.2s ease;
    }
    
    #contest-select option {
      font-size: 16px;
      padding: 12px;
      line-height: 1.4;
    }
    
    #contest-select:hover {
      border-color: #999;
    }
    
    #contest-select:focus {
      outline: none;
      border-color: #666;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    
    .select-container {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    
    .select-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #666;
      text-align: left;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      
      h1 {
        font-size: 20px;
      }
      
      .description {
        font-size: 12px;
      }
      
      #controls {
        margin-bottom: 20px;
      }
      
      #contest-select, #contest-select option {
        font-size: 16px;  /* Keep font size readable on mobile */
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>San Francisco Election Results by Precinct</h1>
  <div class="description">Bubble size represents total votes in each precinct for the selected contest</div>
  
  <div id="controls">
    <div class="select-container">
      <label for="contest-select" class="select-label">Select Contest:</label>
      <select id="contest-select"></select>
    </div>
  </div>
  
  <div id="map-container">
    <div id="tooltip" class="tooltip"></div>
  </div>
  
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    // Main dimensions and setup
    const width = 960;
    const height = 960;
    
    // Create SVG
    const svg = d3.select("#map-container")
      .append("svg")
      .attr("width", width)
      .attr("height", height);
      
    // Create tooltip
    const tooltip = d3.select("#tooltip");
    
    // Define projection for San Francisco
    const projection = d3.geoMercator()
      .center([-122.425469, 37.7715049])
      .scale(220000)
      .translate([width / 2, height / 2]);
      
    const path = d3.geoPath()
      .projection(projection);
    
    // Load all data files
    Promise.all([
      d3.json("11-2024-precinct-shapes.json"),
      d3.json("11-2024-precinct-vote.json"),
      d3.json("11-2024-meta.json"),
      d3.json("precinct-centroids.json")
    ]).then(([shapesData, votesData, metaData, centroidsData]) => {
      // Get contest ID from URL if present
      const urlParams = new URLSearchParams(window.location.search);
      const contestIdFromUrl = urlParams.get('contest');
      
      // Set up the dropdown for contest selection
      const contests = metaData.contests;
      const contestSelect = d3.select("#contest-select");
      
      // Add options to dropdown
      contests.forEach(contest => {
        contestSelect.append("option")
          .attr("value", contest.Id)
          .text(contest.Description);
      });
      
      // Get precinct features from the shapes file
      const precincts = shapesData.features;
      
      // Create map from precinct ID to votes
      const votesByPrecinct = {};
      votesData.forEach(precinct => {
        votesByPrecinct[precinct.prec_2012] = precinct.Contests;
      });

      // Create a map of precinct ID to centroids
      const centroidsByPrecinctId = {};
      centroidsData.centroids.forEach(centroidData => {
        centroidsByPrecinctId[centroidData.id] = {
          longitude: centroidData.longitude,
          latitude: centroidData.latitude,
          description: centroidData.description,
          neighborhood: centroidData.neighborhood
        };
      });
      
      // Draw the base map (grey)
      svg.append("g")
        .selectAll("path")
        .data(precincts)
        .enter()
        .append("path")
        .attr("d", path)
        .attr("class", "land");
      
      // Draw precinct boundaries
      svg.append("g")
        .selectAll("path")
        .data(precincts)
        .enter()
        .append("path")
        .attr("d", path)
        .attr("class", "boundary");
      
      // Create a separate group for bubbles - this MUST be after the map
      const bubblesGroup = svg.append("g");
      
      // Utility function to calculate total votes for a precinct and contest
      function getTotalVotes(precinctId, contestId) {
        const precinctData = votesByPrecinct[precinctId] || {};
        const contestData = precinctData[contestId] || {};
        let total = 0;
        
        // Sum all votes except for total and maxVote fields
        Object.keys(contestData).forEach(key => {
          if (key !== 'total' && key !== 'maxVote') {
            total += contestData[key] || 0;
          }
        });
        
        return total;
      }
      
      // Function to update visualization when contest changes
      function updateVisualization(contestId) {
        // Find the contest
        const selectedContest = contests.find(c => c.Id == contestId);
        if (!selectedContest) return;
        
        // Clear existing bubbles
        bubblesGroup.selectAll("*").remove();
        
        // Find max votes for scaling
        let maxVotes = 0;
        precincts.forEach(precinct => {
          const precinctId = precinct.properties.prec_2012;
          const votes = getTotalVotes(precinctId, contestId);
          if (votes > maxVotes) maxVotes = votes;
        });
        
        // Scale for bubble sizes
        const radiusScale = d3.scaleLinear()
          .domain([0, maxVotes])
          .range([0, 8]);
        
        // Get all candidates for this contest
        const candidatesForContest = metaData.candidates
          .filter(candidate => candidate.ContestId == contestId)
          .filter(candidate => candidate.Type !== "WriteIn" && candidate.Type !== "QualifiedWriteIn");
        
        // Create a color scale for the candidates
        const candidateIds = candidatesForContest.map(c => String(c.Id));
        let colorScale = d3.scaleOrdinal()
          .domain(candidateIds)
          .range(d3.schemeCategory10);
          
        // For Yes/No contests, override with green/red colors
        const isYesNoContest = candidatesForContest.length === 2 && 
                              (candidatesForContest[0].Description === "YES" || 
                               candidatesForContest[0].Description === "BONDS - YES" ||
                               candidatesForContest[1].Description === "YES" ||
                               candidatesForContest[1].Description === "BONDS - YES");
                               
        if (isYesNoContest) {
          // Find YES and NO options
          const yesOption = candidatesForContest.find(c => 
            c.Description === "YES" || 
            c.Description === "BONDS - YES");
            
          const noOption = candidatesForContest.find(c => 
            c.Description === "NO" || 
            c.Description === "BONDS - NO");
            
          if (yesOption && noOption) {
            // Override the colors for YES/NO
            const yesColor = "#28a745"; // Green
            const noColor = "#dc3545";  // Red
            
            // Save the original domain method
            const originalDomain = colorScale.domain;
            
            // Create a separate color mapping function for yes/no that preserves methods
            const yesNoColorScale = function(d) {
              if (d === String(yesOption.Id)) return yesColor;
              if (d === String(noOption.Id)) return noColor;
              return colorScale(d); // Fallback to original scale
            };
            
            // Copy methods from original scale to maintain API compatibility
            yesNoColorScale.domain = originalDomain;
            
            // Replace the colorScale with our custom function for this contest
            colorScale = yesNoColorScale;
          }
        }
        
        // Clear any existing legend
        d3.select("#legend-container").remove();
        
        // Create legend
        const legendContainer = svg.append("g")
          .attr("id", "legend-container")
          .attr("transform", `translate(${width - 200}, 20)`);
        
        // Add legend title
        legendContainer.append("text")
          .attr("x", 0)
          .attr("y", 0)
          .attr("font-weight", "bold")
          .text("Candidate Colors");
        
        if (candidatesForContest.length === 2 && isYesNoContest) {
          // Special legend for YES/NO races showing the gradient
          // Find YES and NO options
          const yesOption = candidatesForContest.find(c => 
            c.Description === "YES" || c.Description === "BONDS - YES");
            
          const noOption = candidatesForContest.find(c => 
            c.Description === "NO" || c.Description === "BONDS - NO");
          
          // Colors for yes/no
          const yesColor = "#28a745";  // Green
          const noColor = "#dc3545";   // Red
          const neutralColor = "#ffffff"; // White for 50/50 split
          
          // Add legend items with description of the gradient
          legendContainer.append("text")
            .attr("x", 0)
            .attr("y", 20)
            .attr("font-size", "12px")
            .text("Color shows vote distribution:");
          
          // Create gradient definition
          const gradientId = "legend-gradient";
          const gradient = svg.append("defs")
            .append("linearGradient")
            .attr("id", gradientId)
            .attr("x1", "0%")
            .attr("y1", "0%")
            .attr("x2", "100%")
            .attr("y2", "0%");
            
          gradient.append("stop")
            .attr("offset", "0%")
            .attr("stop-color", noColor);
            
          gradient.append("stop")
            .attr("offset", "50%")
            .attr("stop-color", neutralColor);
            
          gradient.append("stop")
            .attr("offset", "100%")
            .attr("stop-color", yesColor);
          
          // Add gradient rectangle
          legendContainer.append("rect")
            .attr("x", 0)
            .attr("y", 30)
            .attr("width", 150)
            .attr("height", 15)
            .attr("fill", `url(#${gradientId})`)
            .attr("stroke", "#999")
            .attr("stroke-width", 0.5);
          
          // Add labels for the extremes and middle
          legendContainer.append("text")
            .attr("x", 0)
            .attr("y", 60)
            .attr("font-size", "11px")
            .text(`100% NO`);
            
          legendContainer.append("text")
            .attr("x", 150)
            .attr("y", 60)
            .attr("font-size", "11px")
            .attr("text-anchor", "end")
            .text(`100% YES`);
          
        } else {
          // Standard legend for multi-candidate races
          candidatesForContest.forEach((candidate, i) => {
            const candidateId = String(candidate.Id);
            const color = colorScale(candidateId);
            
            const legendItem = legendContainer.append("g")
              .attr("transform", `translate(0, ${i * 20 + 20})`);
            
            legendItem.append("rect")
              .attr("width", 15)
              .attr("height", 15)
              .attr("fill", color);
            
            legendItem.append("text")
              .attr("x", 20)
              .attr("y", 12)
              .attr("font-size", "12px")
              .text(candidate.Description);
          });
          
          // Add explanation for multi-candidate races
          const lastY = 20 + candidatesForContest.length * 20;
          legendContainer.append("text")
            .attr("x", 0)
            .attr("y", lastY + 20)
            .attr("font-size", "11px")
            .text("Color intensity shows");
            
          legendContainer.append("text")
            .attr("x", 0)
            .attr("y", lastY + 35)
            .attr("font-size", "11px")
            .text("margin of victory");
        }

        // Add circle for each precinct using precomputed centroids
        precincts.forEach(precinct => {
          const precinctId = precinct.properties.prec_2012;
          const votes = getTotalVotes(precinctId, contestId);
          const centroid = centroidsByPrecinctId[precinctId];
          
          if (votes > 0 && centroid) {
            // Find the winner in this precinct
            const precinctData = votesByPrecinct[precinctId] || {};
            const contestData = precinctData[contestId] || {};
            
            let maxVotesForCandidate = 0;
            let winningCandidateId = null;
            let totalContestVotes = 0;
            
            // First, calculate total votes for this contest in this precinct
            Object.keys(contestData).forEach(candidateId => {
              if (candidateId !== 'total' && candidateId !== 'maxVote') {
                const candidateVotes = contestData[candidateId] || 0;
                totalContestVotes += candidateVotes;
              }
            });
            
            // Then find the winner
            Object.keys(contestData).forEach(candidateId => {
              if (candidateId !== 'total' && candidateId !== 'maxVote') {
                const candidateVotes = contestData[candidateId] || 0;
                if (candidateVotes > maxVotesForCandidate) {
                  maxVotesForCandidate = candidateVotes;
                  winningCandidateId = String(candidateId);
                }
              }
            });
            
            // Calculate win percentage and opacity
            let winPercentage = totalContestVotes > 0 ? maxVotesForCandidate / totalContestVotes : 0;
            
            // For yes/no contests, check if it's the "YES" option that won
            const isYesNoContest = candidatesForContest.length === 2 && 
                                  (candidatesForContest[0].Description === "YES" || 
                                   candidatesForContest[0].Description === "BONDS - YES");
            
            if (isYesNoContest) {
              // Find the YES option
              const yesOption = candidatesForContest.find(c => 
                c.Description === "YES" || c.Description === "BONDS - YES");
              
              if (yesOption) {
                // Calculate percentage of YES votes regardless of whether YES won
                const yesVotes = contestData[yesOption.Id] || 0;
                winPercentage = totalContestVotes > 0 ? yesVotes / totalContestVotes : 0;
              }
            }
            
            // Instead of opacity, determine color based on win percentage
            let circleColor;
            
            if (candidatesForContest.length === 2 && isYesNoContest) {
              // ONLY for YES/NO contests, use the gradient approach
              const option1 = candidatesForContest[0];
              const option2 = candidatesForContest[1];
              
              // Use green for YES, red for NO
              const yesColor = "#28a745";  // Green
              const noColor = "#dc3545";   // Red
              const neutralColor = "#ffffff"; // White for 50/50 split
              
              // Find the YES option
              const yesOption = candidatesForContest.find(c => 
                c.Description === "YES" || c.Description === "BONDS - YES");
              
              // Calculate percentage of YES votes
              const yesVotes = contestData[yesOption.Id] || 0;
              const yesPercentage = totalContestVotes > 0 ? yesVotes / totalContestVotes : 0;
              
              // Create interpolator between colors based on whether YES is above or below 50%
              let colorInterpolator;
              if (yesPercentage <= 0.5) {
                // Below 50% YES - interpolate from red to white
                // Rescale the percentage to 0-1 range for interpolation
                const scaledPercentage = yesPercentage * 2; // 0% -> 0, 50% -> 1
                colorInterpolator = d3.interpolate(noColor, neutralColor);
                circleColor = colorInterpolator(scaledPercentage);
              } else {
                // Above 50% YES - interpolate from white to green
                // Rescale the percentage to 0-1 range for interpolation
                const scaledPercentage = (yesPercentage - 0.5) * 2; // 50% -> 0, 100% -> 1
                colorInterpolator = d3.interpolate(neutralColor, yesColor);
                circleColor = colorInterpolator(scaledPercentage);
              }
            } else {
              // For all other contests (including non-YES/NO two-candidate races)
              // Blend between winner's color and neutral gray based on win margin
              if (winningCandidateId) {
                const winnerColor = colorScale(winningCandidateId);
                const neutralColor = "#cccccc"; // Light gray
                
                // Create an interpolator that goes from neutral to full color
                // as win percentage goes from 0.34 (bare minimum win in 3-way race) to 0.8 (decisive win)
                const blendScale = d3.scaleLinear()
                  .domain([1/candidatesForContest.length, 0.8])
                  .range([0.2, 1])
                  .clamp(true);
                
                const colorStrength = blendScale(winPercentage);
                const colorInterpolator = d3.interpolate(neutralColor, winnerColor);
                circleColor = colorInterpolator(colorStrength);
              } else {
                circleColor = "gray";
              }
            }
            
            // Project the longitude/latitude to SVG coordinates
            const [x, y] = projection([centroid.longitude, centroid.latitude]);
            
            // Only add if projected coordinates are valid
            if (!isNaN(x) && !isNaN(y)) {
              // Add circle at this location
              bubblesGroup.append("circle")
                .attr("cx", x)
                .attr("cy", y)
                .attr("r", radiusScale(votes))
                .attr("class", "bubble")
                .attr("fill", circleColor)
                .on("mouseover", function(event) {
                  // Make circle bigger on hover
                  d3.select(this)
                    .attr("r", radiusScale(votes) * 1.5)
                    .attr("stroke-width", 2);

                  // Find winning candidate name
                  const winner = candidatesForContest.find(c => c.Id == winningCandidateId);
                  const winnerName = winner ? winner.Description : "No winner determined";
                  
                  // Format the win percentage
                  const winPercentText = isYesNoContest
                    ? `${(winPercentage * 100).toFixed(1)}% Yes`
                    : `Winner: ${(winPercentage * 100).toFixed(1)}%`;
                  
                  // Get vote counts for each candidate
                  const precinctData = votesByPrecinct[precinctId] || {};
                  const contestData = precinctData[contestId] || {};
                  
                  // Create HTML for vote counts with bars
                  let candidateVotesHtml = '<hr><strong>Vote Breakdown:</strong><br>';
                  
                  // Filter candidates to only those with > 1% of votes
                  const significantCandidates = candidatesForContest.filter(candidate => {
                    const votes = contestData[candidate.Id] || 0;
                    const votePercent = totalContestVotes > 0 
                      ? (votes / totalContestVotes) * 100
                      : 0;
                    return votePercent > 1;
                  });

                  // Sort candidates by vote count (descending)
                  significantCandidates.sort((a, b) => {
                    const votesA = contestData[a.Id] || 0;
                    const votesB = contestData[b.Id] || 0;
                    return votesB - votesA;
                  });

                  significantCandidates.forEach(candidate => {
                    const votes = contestData[candidate.Id] || 0;
                    const votePercent = totalContestVotes > 0 
                      ? ((votes / totalContestVotes) * 100).toFixed(1) 
                      : 0;
                    
                    // Get the color for this candidate/option
                    let barColor;
                    if (isYesNoContest) {
                      const isYes = candidate.Description === "YES" || candidate.Description === "BONDS - YES";
                      barColor = isYes ? "#28a745" : "#dc3545";
                    } else {
                      barColor = colorScale(String(candidate.Id));
                    }
                    
                    // Create bar chart
                    candidateVotesHtml += `
                      <div class="vote-bar">
                        <div class="vote-bar-label">${candidate.Description}: ${votes} (${votePercent}%)</div>
                        <div class="vote-bar-container">
                          <div class="vote-bar-fill" style="width: ${votePercent}%; background-color: ${barColor}"></div>
                        </div>
                      </div>`;
                  });

                  // Add a note about other candidates if any were filtered out
                  const otherCandidates = candidatesForContest.length - significantCandidates.length;
                  if (otherCandidates > 0) {
                    candidateVotesHtml += `<div style="margin-top: 10px; font-size: 11px; color: #666;">
                      ${otherCandidates} other candidate${otherCandidates > 1 ? 's' : ''} received less than 1% of votes
                    </div>`;
                  }
                  
                  // Calculate position relative to the map container
                  const svgRect = svg.node().getBoundingClientRect();
                  const tooltipX = event.clientX - svgRect.left;
                  const tooltipY = event.clientY - svgRect.top;
                  
                  tooltip
                    .style("opacity", 1)
                    .html(`<strong>Precinct:</strong> ${centroid.description}<br>
                           <strong>Neighborhood:</strong> ${centroid.neighborhood}<br>
                           <strong>Total Votes:</strong> ${votes}<br>
                           ${candidateVotesHtml}`)
                    .style("left", tooltipX + "px")
                    .style("top", tooltipY + "px");
                })
                .on("mouseout", function() {
                  // Restore original size
                  d3.select(this)
                    .attr("r", radiusScale(votes))
                    .attr("stroke-width", 1);
                    
                  tooltip.style("opacity", 0);
                });
            }
          }
        });
      }
      
      // Update URL when contest changes
      contestSelect.on("change", function() {
        const newContestId = this.value;
        // Update URL without reloading the page
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('contest', newContestId);
        window.history.pushState({}, '', newUrl);
        
        updateVisualization(newContestId);
      });
      
      // Initialize with contest from URL, or turnout (99), or first contest
      const initialContest = contestIdFromUrl ? 
        contests.find(c => c.Id == contestIdFromUrl) || contests[0] :
        contests.find(c => c.Id === 99) || contests[0];
      
      contestSelect.property("value", initialContest.Id);
      updateVisualization(initialContest.Id);
    });
  </script>
</body>
</html>
